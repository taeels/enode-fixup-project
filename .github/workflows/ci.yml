name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 진짜 Postgres 로 돈다 — I5(전부 아니면 전무)는 트랜잭션으로 얻는 것이라
    # 가짜 저장소로는 검증되지 않는다. 없으면 그 테스트들이 t.Skip 으로 사라진다.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: enode
          POSTGRES_PASSWORD: enode
          POSTGRES_DB: enode
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U enode"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENODE_TEST_DATABASE_URL: postgres://enode:enode@127.0.0.1:5432/enode?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      # go-version-file 로 go.mod 의 toolchain 을 그대로 쓴다.
      # 버전을 두 곳에 적지 않는다 (ADR-012 의 원칙을 CI 에 적용)
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - run: go version

      # 표기 규약(CLAUDE.md · enode-design 표기 규약 제2판)의 집행 자리다.
      # 재고를 0 으로 만든 뒤이므로 「하나라도 있으면 실패」가 성립한다.
      - name: 장식 문자가 없는지
        run: |
          # -I 로 이진 파일을 건너뛴다. 검사 대상은 사람이 쓴 텍스트인데,
          # 컴파일된 바이너리에서 E2 98 85 세 바이트가 우연히 이어지면
          # 그것을 잡고 「어느 소스에 별이 들어왔나」로 사람을 보낸다.
          if grep -rlIP '\x{2605}' --exclude-dir=.git --exclude-dir=dist . ; then
            echo
            echo '위 파일에 장식 강조가 들어왔다 (CLAUDE.md 1.2).'
            exit 1
          fi

      - name: 포맷
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: 테스트
        run: go test ./... -count=1
      - name: DB 테스트가 스킵되지 않았는지
        run: |
          go test ./internal/api/ -count=1 -v 2>&1 | tee /tmp/api.log
          grep -q 'SKIP' /tmp/api.log && { echo 'DB 테스트가 스킵됐다'; exit 1; } || true

  # ADR-015 가 Go 를 고른 핵심 이유를 검증한다
  # "리눅스 CI 에서 GOOS=windows 로 exe 가 나온다" 가 깨지면
  # 윈도우 enode 배포 계획이 통째로 무너진다. 그때 가서 알면 늦다.
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: 크로스 빌드 — windows/amd64 · linux/arm (Pi 2)
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=linux   GOARCH=arm GOARM=7 go build ./...
          GOOS=darwin  GOARCH=arm64 go build ./...
