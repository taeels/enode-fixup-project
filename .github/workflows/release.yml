# 태그를 밀면 릴리즈가 선다.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# ★ 자기 빌드를 따로 안 짓는다 ★ — package.yml 을 그대로 부른다(workflow_call).
# 릴리즈가 자기 경로를 가지면 실험에서 초록불이던 것이 릴리즈에서 다르게
# 굽히고, 그 차이는 ★ 사람이 설치본을 받아본 뒤에야 ★ 보인다.
#
# ★ 그래서 순서가 이렇다 ★ — 짓는다 → ★ 세 운영체제에 깔아 본다 ★ → 그다음에
# 릴리즈를 만든다. 검증 잡이 하나라도 빨간불이면 publish 가 안 돈다.
# 반쯤 깨진 설치본이 릴리즈 페이지에 올라가는 것보다 릴리즈가 안 서는 편이 낫다.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # 짓고 · 깔아 보고 — package.yml 이 전부 한다.
  package:
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ github.ref_name }}
      macos: true

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ★ 부른 워크플로의 산출물은 같은 run 에 있다 ★ — 다시 굽지 않는다.
      - uses: actions/download-artifact@v4
        with:
          name: installers-linux-windows
          path: rel
      - uses: actions/download-artifact@v4
        with:
          name: installer-macos
          path: rel

      # ★ 체크섬을 다시 짓는다 ★ — 맥 pkg 는 리눅스 잡이 끝난 뒤에 나오므로
      # 그때 만든 SHA256SUMS 에는 안 들어 있다. 여기서 전부 다시 센다.
      - name: 체크섬
        run: |
          cd rel
          rm -f SHA256SUMS
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: 릴리즈 노트
        run: |
          cat > NOTES.md <<'MD'
          ## 설치

          | 대상 | 받을 것 | 까는 법 |
          |---|---|---|
          | 데비안 · 우분투 | `enode_*_amd64.deb` · `_arm64.deb` | `sudo dpkg -i enode_*.deb` |
          | 페도라 · 로키 · RHEL | `enode-*.x86_64.rpm` · `.aarch64.rpm` | `sudo rpm -i enode-*.rpm` |
          | 윈도우 (x64) | `enode-*-windows-amd64.msi` | 더블클릭, 또는 `msiexec /i enode-*.msi` |
          | 맥 (인텔 · 애플 실리콘) | `enode-*-macos.pkg` | `sudo installer -pkg enode-*.pkg -target /` |
          | 그 밖에 | `tar.gz` · `zip` | 풀어서 `PATH` 에 둔다 |

          ### 알아 둘 것

          - **서명이 없다.** 맥에서 `.pkg` 를 더블클릭하면 Gatekeeper 가 막는다 —
            위 표의 `installer` 명령으로는 깔린다. 윈도우도 SmartScreen 경고가 뜬다.
          - **윈도우 MSI 는 `PATH` 를 안 건드린다.** 설치 경로는
            `C:\Program Files\enode` 이고, 그 경로를 직접 부르거나 손으로 `PATH` 에 넣는다.
          - **윈도우 ARM 은 `.zip` 뿐이다** — MSI 를 굽는 도구가 arm64 를 아직 거절한다.
          - **리눅스 패키지는 서비스 유닛을 안 넣는다.** 노드는 설정 파일마다 하나이므로
            (`ADR-017`) 필요한 것은 유닛 하나가 아니라 템플릿이고, 그것은 자격증명이
            어디서 오는지를 정해야 한다. 예시 설정은 `/usr/share/doc/enode/examples/` 에 있다.

          모든 설치본은 **세 운영체제에서 실제로 깔아 본 뒤** 여기 올라온다.
          MD
          echo "--- 노트 ---"; cat NOTES.md

      - name: 릴리즈
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ★ 미리보기 태그는 미리보기로 낸다 ★ — v0.1.0-rc1 처럼 뒤에 무언가
          # 붙은 것은 정식판이 아니다. 사람이 실수로 집는 것을 표시가 막는다.
          pre=""
          case "${{ github.ref_name }}" in
            *-*) pre="--prerelease" ;;
          esac
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file NOTES.md \
            $pre \
            rel/*
