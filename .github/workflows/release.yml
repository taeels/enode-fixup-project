# 태그를 밀면 릴리즈가 선다.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# 자기 빌드를 따로 안 짓는다 — package.yml 을 그대로 부른다(workflow_call).
# 릴리즈가 자기 경로를 가지면 실험에서 초록불이던 것이 릴리즈에서 다르게
# 굽히고, 그 차이는 사람이 설치본을 받아본 뒤에야 보인다.
#
# 그래서 순서가 이렇다 — 짓는다 → 세 운영체제에 깔아 본다 → 그다음에
# 릴리즈를 만든다. 검증 잡이 하나라도 빨간불이면 publish 가 안 돈다.
# 반쯤 깨진 설치본이 릴리즈 페이지에 올라가는 것보다 릴리즈가 안 서는 편이 낫다.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # gh release 가 릴리즈를 만들고 자산과 SHA256SUMS 를 올린다

jobs:
  # 짓고 · 깔아 보고 — package.yml 이 전부 한다.
  package:
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 부른 워크플로의 산출물은 같은 run 에 있다 — 다시 굽지 않는다.
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: rel

      # GitHub 이 자산 이름의 ~ 를 . 으로 바꾼다 (실측 v0.0.1-rc2) —
      # nfpm 이 데비안 규칙대로 0.0.1~rc2 로 짓는데, 올라가면 0.0.1.rc2 가 된다.
      # 그러면 SHA256SUMS 의 이름이 받은 파일과 안 맞아 검증이 실패한다.
      # 먼저 우리가 바꿔 두면 올라간 이름과 체크섬이 같아진다.
      # (판 번호 자체는 패키지 메타데이터에 있으므로 파일 이름을 바꿔도 무해하다.)
      - name: 이름 정리
        run: |
          cd rel
          for f in *'~'*; do [ -e "$f" ] || continue; mv -- "$f" "${f//\~/.}"; done
          ls -1

      - name: 체크섬
        run: |
          cd rel
          rm -f SHA256SUMS
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: 릴리즈 노트
        run: |
          cat > NOTES.md <<'MD'
          ## 설치

          ### 패키지가 둘이다

          | 패키지 | 무엇이 들었나 | 어디에 까나 |
          |---|---|---|
          | `enode` | `enode` · `runctl` · `enodectl` | **일을 하는 기계마다** — 노드는 여럿이다 |
          | `enode-mediator` | `mediator` | **한 자리에만** — 시퀀서는 하나다 (`ADR-002`) |

          섞지 않는다. 한 패키지로 묶으면 노드 여러 대에 시퀀서가 따라 들어가고,
          「이 기계에 Mediator 가 깔려 있다」가 **사실이 아닌 채로 참이 된다**.
          같은 기계에 둘 다 두는 것은 자유이고, 그때는 둘을 함께 깔면 된다.

          ### 까는 법

          | 대상 | 받을 것 | 까는 법 |
          |---|---|---|
          | 데비안 · 우분투 | `enode_*_amd64.deb` · `enode-mediator_*_amd64.deb` | `sudo dpkg -i enode_*.deb` |
          | 페도라 · 로키 · RHEL | `enode-0.*.x86_64.rpm` · `enode-mediator-*.x86_64.rpm` | `sudo rpm -i enode-0.*.rpm` |
          | 윈도우 (x64) | `*-windows-amd64.msi` | 더블클릭, 또는 `msiexec /i ...msi` |
          | 그 밖에 | `tar.gz` · `zip` | 풀어서 `PATH` 에 둔다 |

          ### 알아 둘 것

          - **대상은 `linux/amd64` 와 `windows/amd64` 뿐이다.** 맥과 리눅스 ARM 은
            안 되는 것이 아니라 **다른 통로**가 있다 — `packaging/macos/build.sh` 가
            굽는 묶음을 쓴다. 같은 것을 두 곳에서 구우면 어긋났을 때 어느 쪽이
            참인지 알 수 없다.
          - **서명이 없다.** 윈도우에서 SmartScreen 경고가 뜬다.
          - **윈도우 MSI 는 `PATH` 를 안 건드린다.** 설치 경로는
            `C:\Program Files\enode` 와 `C:\Program Files\enode-mediator` 이고,
            그 경로를 직접 부르거나 손으로 `PATH` 에 넣는다.
          - **서비스 유닛을 안 넣는다.** 노드는 설정 파일마다 하나이므로(`ADR-017`)
            필요한 것은 유닛 하나가 아니라 템플릿이고, Mediator 는 하나뿐이지만
            **어느 사용자로 돌고 DB 자격을 어디서 읽는지**를 정해야 한다.
            예시 설정은 `/usr/share/doc/enode{,-mediator}/examples/` 에 있다.

          모든 설치본은 **리눅스 넷과 윈도우에서 실제로 깔아 본 뒤** 여기 올라온다.
          MD
          echo "--- 노트 ---"; cat NOTES.md

      - name: 릴리즈
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 미리보기 태그는 미리보기로 낸다 — v0.1.0-rc1 처럼 뒤에 무언가
          # 붙은 것은 정식판이 아니다. 사람이 실수로 집는 것을 표시가 막는다.
          pre=""
          case "${{ github.ref_name }}" in
            *-*) pre="--prerelease" ;;
          esac
          # 같은 태그로 이 잡이 두 번 도는 일이 있다 — 태그를 다시 붙이거나
          # 이력을 재작성하면 그렇다. create 는 그때 "already exists" 로 죽는다.
          # 반쯤 깨진 설치본이 올라가는 것보다 릴리즈가 안 서는 편이 낫다는 원칙은
          # 여기 안 걸린다. 이미 검증을 통과한 같은 산출물을 다시 올리는 것이다.
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file NOTES.md \
              ${pre:+--prerelease}
            gh release upload "${{ github.ref_name }}" rel/* --clobber
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file NOTES.md \
              $pre \
              rel/*
          fi
