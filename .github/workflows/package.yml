# 설치본을 굽고 실제로 깔아 본다.
#
# 굽는 것과 깔리는 것은 다른 문제다 — 그래서 여기서 짓고 리눅스 넷과
# 윈도우에 실제로 깐다. release.yml 이 이것을 그대로 부르고, 검증이 전부
# 초록일 때만 릴리즈가 선다.
#
# 도는 조건 — 셋 다 사람이 고르는 자리다. main 에 밀어넣는 커밋마다
# 돌지 않는다 — 설치본은 커밋마다 필요하지 않다.
#
# 대상은 linux/amd64 와 windows/amd64 뿐이고 전부 리눅스에서 굽는다.
# 맥과 arm 은 packaging/macos/build.sh 라는 다른 통로가 이미 있다 —
# 같은 것을 두 곳에서 구우면 어긋났을 때 어느 쪽이 참인지 알 수 없다.
#
#   ① packaging-experiment 브랜치에 밀 때
#   ② 손으로 돌릴 때 (workflow_dispatch) — 판 번호를 넣어 볼 수 있다
#   ③ release.yml 이 부를 때 (workflow_call)
#
# ③ 이 있는 이유 — 릴리즈가 자기 빌드를 따로 지으면 경로가 두 벌이 된다.
# 그러면 실험에서 초록불이던 것이 릴리즈에서 다르게 굽히고, 그 차이는 사람이
# 설치본을 받아본 뒤에야 보인다. 릴리즈는 여기서 구운 것을 그대로 낸다.
name: package

on:
  push:
    branches: ['packaging-experiment']
  workflow_dispatch:
    inputs:
      version:
        description: '판 번호 (비우면 0.0.0 — 실험본이라는 뜻)'
        type: string
        default: ''
  workflow_call:
    inputs:
      version:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # ── ① 전부 한 잡에서 나온다 ──────────────────────────────────────────
  # enode 와 enode-mediator 를 각각 deb · rpm · msi · 묶음으로 굽는다.
  # 윈도우 설치본도 여기서 굽는다 — msitools 의 wixl 이 리눅스에서 돈다.
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - id: v
        name: 판 번호를 정한다
        run: |
          v="${{ inputs.version }}"
          [ -z "$v" ] && v="0.0.0"
          # v 는 여기서 뗀다 — 태그 이름의 것이지 판 번호의 것이 아니다.
          # 리눅스 잡은 build-installers.sh 가 알아서 떼지만 맥 잡은 그
          # 스크립트를 안 거친다. 한 곳에서 떼야 자산 이름이 안 갈린다
          # (실측 v0.0.1-rc3: .pkg 하나에만 v 가 남았다).
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "판 번호 = $v"

      - name: 패키징 도구
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wixl zip
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 굽는다
        run: PKG_VERSION="${{ steps.v.outputs.version }}" bash packaging/build-installers.sh

      # 무엇이 나왔는지 눈으로 본다 — 조용히 빠진 것을 잡는 유일한 자리다.
      - name: 목록
        run: ls -la dist/installers && cat dist/installers/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: dist/installers/
          retention-days: 7

  # ── ②  깔아 본다 — 여기가 이 워크플로의 목적이다 ──────────────────
  verify-linux:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12-slim
            install: 'dpkg -i /w/enode_*_amd64.deb /w/enode-mediator_*_amd64.deb'
          - image: ubuntu:24.04
            install: 'dpkg -i /w/enode_*_amd64.deb /w/enode-mediator_*_amd64.deb'
          - image: rockylinux:9
            install: 'rpm -i /w/enode-0.*.x86_64.rpm /w/enode-mediator-*.x86_64.rpm'
          - image: fedora:41
            install: 'rpm -i /w/enode-0.*.x86_64.rpm /w/enode-mediator-*.x86_64.rpm'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: w
      - name: ${{ matrix.image }} 에 깐다
        run: |
          docker run --rm -v "$PWD/w":/w:ro ${{ matrix.image }} sh -c '
            set -e
            ${{ matrix.install }}
            enode --version
            runctl --version
            enodectl --version
            mediator --version
            test -d /etc/enode
            test -d /var/lib/enode/artifacts
            ls /usr/share/doc/enode/examples/
            ls /usr/share/doc/enode-mediator/examples/
          '

      # 섞이지 않았는지 본다 — 노드 패키지만 깔았을 때 mediator 가 따라오면
      # 「이 기계에 Mediator 가 깔려 있다」가 사실이 아닌 채로 참이 된다.
      - name: ${{ matrix.image }} — 노드 패키지만 깔면 mediator 는 없어야 한다
        if: startsWith(matrix.image, 'debian')
        run: |
          docker run --rm -v "$PWD/w":/w:ro ${{ matrix.image }} sh -c '
            set -e
            dpkg -i /w/enode_*_amd64.deb
            enode --version
            if command -v mediator >/dev/null; then
              echo "▲ 노드 패키지에 mediator 가 섞여 들어갔다"; exit 1
            fi
            echo "✓ 갈려 있다"
          '

      # 묶음도 검증한다 — deb 과 rpm 만 보던 자리에 tar.gz 가 빠져 있었다.
      # 윈도우의 zip 과 같은 종류의 구멍이고, 릴리즈 노트가 「그 밖에」 통로로
      # 안내하는 것이 이쪽이다. 컨테이너 안에서는 패키지 관리자를 거치는 것이
      # 오히려 번거로워 손으로 밀어 넣는 자리가 있다(build-installers.sh 의
      # 「원본 묶음」 주석).
      #
      # 한 이미지에서만 돈다 — 묶음이 온전한지는 배포판을 안 탄다.
      - name: 묶음을 풀어 돌린다
        if: startsWith(matrix.image, 'debian')
        run: |
          docker run --rm -v "$PWD/w":/w:ro ${{ matrix.image }} sh -c '
            set -e
            n=0
            for t in /w/*-linux-amd64.tar.gz; do
              n=$((n + 1))
              d=$(mktemp -d)
              tar xzf "$t" -C "$d"
              found=0
              for e in $(find "$d" -type f -perm -u+x); do
                echo "묶음: $(basename "$t") -> $(basename "$e")"
                "$e" --version
                found=$((found + 1))
              done
              [ "$found" -gt 0 ] || { echo "묶음에 실행 파일이 없다: $t"; exit 1; }
            done
            [ "$n" -eq 2 ] || { echo "묶음이 둘이어야 한다: $n 개"; exit 1; }
            # 노드 묶음에 셋이 다 있어야 한다 - 하나라도 빠지면 푼 사람이
            # 그것만 따로 구해야 한다.
            d=$(mktemp -d)
            tar xzf /w/enode-0*-linux-amd64.tar.gz -C "$d"
            for c in enode runctl enodectl; do
              find "$d" -type f -name "$c" | grep -q . || {
                echo "노드 묶음에 없다: $c"; exit 1; }
            done
            echo "✓ 묶음 둘이 온전하다"
          '

  verify-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: w
      # 리눅스에서 구운 msi 를 윈도우가 받아주는지 — 이것을 확인하려고 있다.
      # 둘을 다 깐다 — UpgradeCode 가 갈려 있어야 한쪽이 다른 쪽을
      # 「업그레이드」로 지우지 않는다. 그것을 여기서 잰다.
      - name: msi 둘을 깐다
        shell: pwsh
        run: |
          foreach ($msi in Get-ChildItem w\*.msi) {
            Write-Host "설치본: $($msi.Name)"
            $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v `"install-$($msi.BaseName).log`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content "install-$($msi.BaseName).log" -Tail 40; exit $p.ExitCode }
          }
      - name: 깔린 것을 돌린다
        shell: pwsh
        run: |
          $want = @(
            "C:\Program Files\enode\enode.exe",
            "C:\Program Files\enode\runctl.exe",
            "C:\Program Files\enode\enodectl.exe",
            "C:\Program Files\enode-mediator\mediator.exe"
          )
          foreach ($e in $want) {
            if (-not (Test-Path $e)) { throw "설치 경로에 없다: $e" }
            & $e --version
          }

      # 묶음도 검증한다 — 여기가 비어 있어서 rc13 이 그대로 나갔다.
      #
      # msi 와 zip 은 같은 바이너리를 담지만 도착하는 자리가 다르다. msi 는
      # 설치 관리자가 Program Files 에 쓰고, zip 은 사람이 받은 자리에 푼다.
      # 릴리즈 노트가 「그 밖에」 통로로 안내하는 것이 이쪽이고, rc13 에서
      # enodectl.exe 가 사라진 것도 이쪽이었다.
      #
      # 백신 삭제 자체는 여기서 재현되지 않는다 — 러너에 그 제품이 없다.
      # 그것을 부른 원인은 ci.yml 의 링크 표면 게이트가 잡는다. 여기서
      # 지키는 것은 그보다 앞의 것이다: 묶음이 온전하고 실제로 도는가.
      - name: 묶음을 풀어 돌린다
        shell: pwsh
        run: |
          $zips = Get-ChildItem w\*-windows-amd64.zip
          if ($zips.Count -lt 2) { throw "묶음이 둘이어야 한다: $($zips.Count) 개" }
          foreach ($z in $zips) {
            $dest = Join-Path $PWD "unzipped\$($z.BaseName)"
            Expand-Archive $z.FullName -DestinationPath $dest -Force
            $exes = Get-ChildItem $dest -Recurse -Filter *.exe
            if ($exes.Count -eq 0) { throw "묶음에 실행 파일이 없다: $($z.Name)" }
            foreach ($e in $exes) {
              Write-Host "묶음: $($z.Name) -> $($e.Name)"
              & $e.FullName --version
              if ($LASTEXITCODE -ne 0) { throw "묶음의 $($e.Name) 이 --version 에 실패한다" }
            }
          }
          # 노드 묶음에 셋이 다 있어야 한다 - 하나라도 빠지면 푼 사람이
          # 그것만 따로 구해야 한다.
          $node = Get-ChildItem "unzipped\enode-*-windows-amd64" -Directory |
                  Where-Object { $_.Name -notlike "enode-mediator-*" }
          foreach ($n in "enode.exe", "runctl.exe", "enodectl.exe") {
            if (-not (Get-ChildItem $node.FullName -Recurse -Filter $n)) {
              throw "노드 묶음에 없다: $n"
            }
          }

