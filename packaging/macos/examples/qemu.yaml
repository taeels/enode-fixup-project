# 추가 시나리오 — QEMU 를 실보드 대신 세운다
#
# board 는 원래 "포트에 무엇이 달렸는지는 기계가 모른다" 라서 사람이 적는
# 자리다 (ADR-012). QEMU 도 정확히 그렇다 — 기계는 이 맥에 qemu-system-arm 이
# 있다는 것까지만 알고, 그것을 보드로 쓸 셈인지는 노드 주인의 결정이다.
# 그래서 실보드 대체가 코드 수정 0 개로 성립한다.
#
# tag 로 실물과 가상을 가른다 — 나중에 실보드가 오면 tag 만 다른 노드가
# 하나 더 서고, 계약은 tag 로 지명한다. 오늘 하나뿐이라고 tag 를 비우면
# 그때 계약을 고쳐야 한다 ("오늘은 하나다" 는 관찰이지 제약이 아니다).

mediator: http://192.168.219.203:8080
token: 여기에-mediator-토큰

# 저장소가 없는 워크스페이스일 수 있다 — 그러면 workspace_id 를 적는다
# (ADR-036). 유도가 성공하면 이 값은 무시된다.
workspace: /Users/여러분/zephyrproject/zephyr

board:
  soc: qemu_cortex_m3       # zephyr 보드 이름을 그대로 쓴다
  tag: qemu-mac             # 실물이 아니라는 것이 이름에 남는다
  port: ""                  # 가상이라 포트가 없다

arch: arm-zephyr-eabi
min_free_gb: 20
