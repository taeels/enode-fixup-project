# 맥의 기본 노드 — 추론 하네스만 든 자리.
#
# 파일 이름이 local.yaml 이면 label 이 user@hostname 이 된다 (이름이 안 붙는다).
# 이 파일의 realpath 가 node_id 의 일부다 — 옮기면 다른 노드가 된다.

mediator: http://192.168.219.203:8080     # CT103
token: 여기에-mediator-토큰                # ENODE_TOKEN 으로도 준다

# 워크스페이스가 있으면 git remote 에서 repo 속성이 유도된다.
# 사람이 저장소 주소를 안 적는다 (ADR-017).
workspace: /Users/여러분/work/some-repo

# 디스크가 이 아래로 떨어지면 빌드 능력을 광고에서 뺀다 (기본 10).
min_free_gb: 20
