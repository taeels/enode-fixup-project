# 맥의 기본 노드 — 추론 하네스만 든 자리.
#
# 파일 이름이 local.yaml 이면 label 이 user@hostname 이 된다 (이름이 안 붙는다).
# 이 파일의 realpath 가 node_id 의 일부다 — 옮기면 다른 노드가 된다.

mediator: http://192.168.219.203:8080     # CT103
token: 여기에-mediator-토큰                # ENODE_TOKEN 으로도 준다

# 워크스페이스가 있으면 git remote 에서 repo 속성이 유도된다.
# 사람이 저장소 주소를 안 적는다 (ADR-017).
workspace: /Users/여러분/work/some-repo

# 디스크가 이 아래로 떨어지면 빌드 능력을 광고에서 뺀다 (기본 10).
min_free_gb: 20

# 이 노드가 어느 인증 구성으로 하네스를 돌리는가 (비우면 ~/.claude/settings.json).
#
# 한 기계가 갈래를 둘 쓸 때를 위한 자리다 — Bedrock · 게이트웨이와 사내 LLM 을
# 셸 별칭으로 갈아끼우는 그 두 벌이다. enode 는 그 파일에서 인증 필드
# (apiKeyHelper · env)만 길어와 자기 settings 에 얹는다. 권한 · 훅 · 모델은
# 거기 적혀 있어도 안 읽는다.
#
# name 은 광고에 auth=corp 로 실린다 — 계약이
# requires: [{capability: agent.reason, auth: corp}] 로 이 노드를 고른다.
# 그 이름은 Usable() 을 통과했을 때만 실린다: 가리킨 파일이 없으면 하네스가
# 광고에서 통째로 빠진다.
#
# 갈래가 둘이면 설정 파일을 둘로 만든다 — local-corp.yaml 과
# local-bedrock.yaml 이 그대로 노드 둘이다 (파일의 realpath 가 node_id 의 일부다).
#
# harness_auth:
#   name: corp
#   settings: ~/.claude/settings-corp.json
