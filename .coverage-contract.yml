# 커버리지 계약 (CT-5) — U7 이 단독으로 소유하고 단독으로 쓴다.
#
# 이 파일이 고정하는 것은 수치가 아니라 그 수치를 게이트 입력으로 인정하는
# 조건이다. FR4.4 가 "그 명령이 아닌 측정치는 게이트 입력으로 쓰이지 않는다"
# 로 못박은 것이 아래 command 블록이고, 집행하는 자리는
# .github/workflows/ci.yml 의 "커버리지 (표준 측정 명령 · 패키지별 80% 하한)"
# 스텝이다. 두 자리가 어긋나면 이 파일이 맞다.
version: 1

command:
  # 빠지면 무슨 일이 나는가 — 실측이다. 두 경우 모두 go test 는 exit 0 이라
  # 종료코드만 보는 게이트는 잘못 잰 것과 제대로 잰 것을 구별하지 못한다.
  #
  #   ENODE_TEST_DATABASE_URL 을 빼면
  #     전체            3486/5951 = 58.6%  ->  2036/5951 = 34.2%
  #     internal/store  1213/1498 = 81.0%  ->    82/1498 =  5.5%
  #     internal/api 의 통합 테스트 78개가 t.Skip 으로 사라진다
  #
  #   -coverpkg=./... 를 빼면 각 패키지가 자기 테스트로 덮은 것만 세므로
  #     다른 패키지의 테스트가 덮은 문장이 빠진다
  #     internal/schema  81/107 = 75.7%  ->  80/107 = 74.8%
  #     (차이 나는 한 블록은 internal/schema/schema.go:50-52 의 boundary()
  #      조기 반환이고, 그것을 밟는 것은 internal/contract 쪽 테스트다)
  env: [ENODE_TEST_DATABASE_URL]
  flags: ["-coverpkg=./...", "-count=1"]

  # 플랫폼이 분모를 바꾼다 — //go:build windows 파일 셋
  # (cmd/enodectl/proc_windows.go · internal/enode/lock_windows.go ·
  # internal/enode/disk_windows.go)이 리눅스 프로파일에 아예 안 나온다.
  # AC3.4.6 이 명령뿐 아니라 플랫폼까지 고정하는 이유다.
  platform: linux/amd64

  measured_total_pct: 87.5

  # 기준선을 잰 커밋. 재는 시점에 U7 · U13 의 새 테스트 파일 둘이 아직
  # 커밋되지 않은 채 워킹 트리에 있었다 — 둘 다 _test.go 이므로 statements
  # 를 안 바꾸고 covered 만 올린다. 아래 수치는 그 둘을 포함해 잰 값이다.
  #
  # 이 수치는 AC3.4.6 의 CI 구성에서 아홉 번 재서 블록 4,078개까지 전부
  # 같았던 값이다. 구성이 다르면 값이 다르다 — 가짜 claude 스텁 없이 재면
  # internal/enode 가 1294 대신 1293 으로, 전체가 5231 대신 5230 으로
  # 읽힌다. 그 차이는 세 블록(advertise.go 둘 · detect.go 하나)이고 둘 다
  # 스킵 0건에 exit 0 이라 종료코드로는 구별되지 않는다.
  #
  # 브랜치가 main 으로 들어갈 때 이 값을 그 커밋으로 갱신한다. 갱신하지 않으면
  # 기준선이 명령과 짝을 잃고, 원장 검사기의 「측정」 규칙이 그것을 막는다.
  measured_at_commit: fa444f2b9c411970e9885a29c08cca54d4383d48

floor:
  # FR4.1. 저장소 전체 합계 하나가 아니라 패키지마다 개별로 넘는다.
  #
  # 차단이다. ci.yml 의 커버리지 스텝이 한 패키지라도 미달이면 exit 1 을
  # 낸다. 처음 세울 때는 15개 중 11개가 미달이라 재기만 했고, 미달이 0개가
  # 된 시점에 켰다 (ledger/handover/U7/01.md 가 그 조건을 적어 두었다).
  #
  # 여유가 얇은 자리 — internal/build 가 16/20 = 정확히 80.0% 다. 남은 넷은
  # 이 프로젝트의 표준 명령(-buildvcs 미지정)에서 도달 불가라 산술 상한이고,
  # 그 패키지에 문장 하나만 늘어도 게이트가 빨개진다. 그때 할 일은 하한을
  # 낮추는 것이 아니라 그 문장을 덮는 것이다.
  default_pct: 80

  # packaging/ 은 「빼는」 것이 아니라 애초에 이 집합에 없다. 그 아래는 셸과
  # 파이썬 자산이고 Go 패키지가 아니라서 go list ./... 가 세는 15개에 들지
  # 않는다. 그래도 이름을 적어 두는 이유는, 이 줄이 없으면 다음 사람이
  # 「packaging 은 왜 표에 없나」를 커버리지 결손으로 읽기 때문이다.
  # AC3.1.3 이 이 주석을 요구한다.
  exclude: [packaging/]

# 기준선 — 위 command 를 그대로 돌려 나온 값이다. 같은 명령을 두 번 돌려
# 패키지 단위까지 글자 그대로 같았다(AC3.4.6).
#
# owner_unit 은 이 워크플로에서 그 패키지를 맡았던 단위다. 전부 끝났으므로
# 지금은 이력이지 작업 목록이 아니다. null 인 넷은 처음부터 하한을 넘었다.
# CT-5 의 owner_unit 열거값에 null 이 없으나, 기준선에서 네 패키지를 빼면
# 그것은 기준선이 아니라 작업 목록이 된다 — 스키마 소유자로서 null 을 더하고
# 그 사실을 여기 적는다.
#
# statements 는 하네스 유무와 무관하고 covered 만 움직인다. 아래 covered 는
# 가짜 claude 스텁이 PATH 에 있는 구성, 즉 CI 가 실제로 재는 구성의 값이다.
# 진짜 claude 로 재면 internal/enode 가 1294 대신 1293 이다.
packages:
  - path: cmd/iapadapter
    statements: 717
    covered: 690
    owner_unit: U9
  - path: cmd/runctl
    statements: 224
    covered: 223
    owner_unit: U10
  - path: cmd/enodectl
    statements: 189
    covered: 175
    owner_unit: U10
  - path: cmd/enode
    statements: 105
    covered: 102
    owner_unit: U11
  - path: cmd/mediator
    statements: 241
    covered: 232
    owner_unit: U11
  - path: internal/api
    statements: 402
    covered: 327
    owner_unit: U12
  - path: internal/runctl
    statements: 81
    covered: 78
    owner_unit: U12
  - path: internal/config
    statements: 118
    covered: 100
    owner_unit: U12
  - path: internal/schema
    statements: 107
    covered: 107
    owner_unit: U12
  - path: internal/build
    statements: 20
    covered: 16
    owner_unit: U12
  - path: internal/enode
    statements: 1527
    covered: 1294
    owner_unit: U13
  - path: internal/store
    statements: 1501
    covered: 1232
    owner_unit: null
  - path: internal/record
    statements: 159
    covered: 131
    owner_unit: null
  - path: internal/contract
    statements: 548
    covered: 485
    owner_unit: null
  - path: internal/match
    statements: 40
    covered: 39
    owner_unit: null

# CT-6 의 allowed_skips 블록은 이 파일에 없다.
#
# CT-6 은 허용목록을 "같은 파일의 다른 블록" 으로 적었으나 AC3.4.3 은 그
# 목록의 이름을 .ci-allowed-skips 로 문면에 든다. 두 자리에 두면 한쪽만
# 낡는 것이 이 워크플로가 막으려는 실패 양식 그대로라, 스키마 소유자로서
# 자리를 .ci-allowed-skips 하나로 정하고 그 사실을 여기 적는다. 필드는
# CT-6 이 정한 다섯을 그대로 쓴다 —
# test_name · file · condition · why_unprovisionable · requested_by.
#
# 그 파일을 읽는 것은 ci.yml 의 "스킵 감시 (전 패키지)" 스텝이고, 지금
# 항목은 0개다. CI 가 조건을 갖출 수 없는 스킵이 하나도 없기 때문이며,
# 빈 목록은 "어떤 스킵도 봐주지 않는다" 는 뜻이다.
