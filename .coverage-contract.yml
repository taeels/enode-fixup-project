# CT-6 의 allowed_skips 블록은 이 파일에 없다.
#
# CT-6 은 허용목록을 "같은 파일의 다른 블록" 으로 적었으나 AC3.4.3 은 그
# 목록의 이름을 .ci-allowed-skips 로 문면에 든다. 두 자리에 두면 한쪽만
# 낡는 것이 이 워크플로가 막으려는 실패 양식 그대로라, 스키마 소유자로서
# 자리를 .ci-allowed-skips 하나로 정하고 그 사실을 여기 적는다. 필드는
# CT-6 이 정한 다섯을 그대로 쓴다 —
# test_name · file · condition · why_unprovisionable · requested_by.
#
# 그 파일을 읽는 것은 ci.yml 의 "스킵 감시 (전 패키지)" 스텝이고, 지금
# 항목은 0개다. CI 가 조건을 갖출 수 없는 스킵이 하나도 없기 때문이며,
# 빈 목록은 "어떤 스킵도 봐주지 않는다" 는 뜻이다.
