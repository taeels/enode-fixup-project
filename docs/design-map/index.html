<title>enode 설계 지도</title>
<meta name="description" content="초기 ADR 10건을 「굳이 왜 필요한가」라는 되물음 아래 마인드맵으로 펼친 enode 설계 진행 지도">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ground: #F4F5F8;
    --surface: #FFFFFF;
    --ink: #172B4D;
    --sub: #5E6C84;
    --faint: #97A0AF;
    --line: #DFE1E6;
    --line-strong: #B3BAC5;
    --wash: rgba(23, 43, 77, 0.035);
    --grid: rgba(23, 43, 77, 0.08);
    --run: #5243AA;
    --run-bg: #F3F0FF;
    --run-ring: rgba(82, 67, 170, 0.22);
    --on-run: #FFFFFF;
    --hw: #1F6E43;
    --hw-bg: #E8F5EC;
    --def: #974F0C;
    --def-bg: #FFFAE6;
    --link: #0052CC;
    --root-bg: #172B4D;
    --root-fg: #FFFFFF;
    --shadow: 0 1px 2px rgba(23, 43, 77, 0.08), 0 2px 8px rgba(23, 43, 77, 0.05);
    --sans: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0E1117;
      --surface: #161B24;
      --ink: #DCE2EC;
      --sub: #9AA5B6;
      --faint: #667085;
      --line: #283041;
      --line-strong: #414B5F;
      --wash: rgba(220, 226, 236, 0.04);
      --grid: rgba(220, 226, 236, 0.07);
      --run: #A99CF6;
      --run-bg: #221D3F;
      --run-ring: rgba(169, 156, 246, 0.28);
      --on-run: #14112A;
      --hw: #79CE9C;
      --hw-bg: #13261B;
      --def: #E6A75F;
      --def-bg: #2A1F10;
      --link: #7DB0FF;
      --root-bg: #DCE2EC;
      --root-fg: #0E1117;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.25);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0E1117;
    --surface: #161B24;
    --ink: #DCE2EC;
    --sub: #9AA5B6;
    --faint: #667085;
    --line: #283041;
    --line-strong: #414B5F;
    --wash: rgba(220, 226, 236, 0.04);
    --grid: rgba(220, 226, 236, 0.07);
    --run: #A99CF6;
    --run-bg: #221D3F;
    --run-ring: rgba(169, 156, 246, 0.28);
    --on-run: #14112A;
    --hw: #79CE9C;
    --hw-bg: #13261B;
    --def: #E6A75F;
    --def-bg: #2A1F10;
    --link: #7DB0FF;
    --root-bg: #DCE2EC;
    --root-fg: #0E1117;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 12px rgba(0, 0, 0, 0.25);
  }

  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
  }
  button { font: inherit; color: inherit; }
  code {
    font-family: var(--mono);
    font-size: 0.92em;
    background: var(--wash);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 4px;
  }

  .app {
    box-sizing: border-box;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-inline: 16px;
    padding-block: 12px;
  }

  /* header */
  .top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 20px;
  }
  .brand { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
  .brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .brand h1 .mark { font-family: var(--mono); font-weight: 500; color: var(--run); margin-right: 6px; }
  .brand p { margin: 0; color: var(--sub); font-size: 12.5px; }
  .brand p code { font-size: 11.5px; }
  .tabs {
    display: inline-flex;
    padding: 2px;
    gap: 2px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
  }
  .tabs button {
    border: 0;
    background: none;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--sub);
    font-weight: 500;
  }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); }
  .tabs button:focus-visible, .btn:focus-visible, .tick:focus-visible, .ref:focus-visible, .row:focus-visible {
    outline: 2px solid var(--run);
    outline-offset: 2px;
  }

  /* stage */
  .stage {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(320px, 380px);
    grid-template-rows: minmax(0, 1fr) auto;
    gap: 12px;
  }
  .mapwrap {
    grid-column: 1;
    grid-row: 1;
    position: relative;
    min-height: 0;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .progress {
    grid-column: 1;
    grid-row: 2;
    display: grid;
    gap: 10px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .panel {
    grid-column: 2;
    grid-row: 1 / span 2;
    min-height: 0;
    overflow: auto;
    padding: 20px 22px 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
  }

  /* canvas */
  .canvas {
    position: absolute;
    inset: 0;
    cursor: grab;
    touch-action: none;
    background-image: radial-gradient(var(--grid) 1px, transparent 1.3px);
    background-size: 20px 20px;
  }
  .canvas.is-panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #world.glide { transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1); }
  #edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

  .zoom {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 2;
  }
  .btn {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 7px;
    padding: 5px 10px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1.2;
  }
  .btn:hover { border-color: var(--line-strong); }
  .zoom .btn { min-width: 44px; padding: 6px 8px; box-shadow: var(--shadow); }

  /* nodes */
  .node {
    position: absolute;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 5px;
    text-align: left;
    padding: 8px 11px 10px;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: opacity 0.35s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .node:hover { border-color: var(--ink); }
  .node:focus-visible { outline: 2px solid var(--run); outline-offset: 3px; }
  .node--root {
    width: 230px;
    padding: 14px 16px 15px;
    background: var(--root-bg);
    color: var(--root-fg);
    border-color: var(--root-bg);
    border-radius: 14px;
  }
  .node--q { width: 208px; border: 1.5px solid var(--ink); }
  .node--adr { width: 184px; }
  .node--adr .node__title { font-size: 13.5px; }
  .node__eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: var(--sub); }
  .node--root .node__eyebrow { color: inherit; opacity: 0.72; font-family: var(--mono); letter-spacing: 0.02em; }
  .node__title { font-size: 14px; font-weight: 600; line-height: 1.38; text-wrap: balance; }
  .node--q .node__title { font-size: 14.5px; }
  .node--root .node__title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .node__sub { font-size: 12px; line-height: 1.45; opacity: 0.82; }
  .node__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .node__id {
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 500;
    color: var(--sub);
    font-variant-numeric: tabular-nums;
    margin-right: 2px;
  }

  .node.is-rejected { background: var(--wash); border-color: var(--line); box-shadow: none; }
  .node.is-rejected .node__title {
    color: var(--sub);
    text-decoration: line-through;
    text-decoration-color: var(--faint);
  }
  .node.is-expiring { border: 1.5px dashed var(--def); }
  .node.is-related { border-color: var(--ink); }
  .node.is-related-amends { border-color: var(--run); }
  .node.is-selected {
    border-color: var(--run);
    box-shadow: 0 0 0 3px var(--run-ring), var(--shadow);
  }
  .node--root.is-selected { box-shadow: 0 0 0 4px var(--run-ring), var(--shadow); }
  .node.is-future { opacity: 0.1; pointer-events: none; box-shadow: none; }
  .node.is-new { animation: arrive 0.5s ease; }
  @keyframes arrive {
    from { transform: translateY(6px); }
    to { transform: none; }
  }

  /* chips */
  .chip {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 500;
    line-height: 1;
    padding: 3px 6px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    color: var(--sub);
    white-space: nowrap;
  }
  .chip--amended { border-color: var(--run); color: var(--run); }
  .chip--rejected { border-color: var(--line-strong); color: var(--sub); background: var(--wash); }
  .chip--expiring { border: 1px dashed var(--def); color: var(--def); background: var(--def-bg); }
  .chip--hw { border-color: transparent; background: var(--hw-bg); color: var(--hw); }
  .chip--follows { border-color: var(--ink); color: var(--ink); }
  .chip--supersedes { border-style: dashed; }

  /* edges */
  .e-tree { fill: none; stroke: var(--line-strong); stroke-width: 1.5; transition: opacity 0.35s ease; }
  .e-trunk { stroke-width: 2.5; }
  .e-tree.is-future { opacity: 0.12; }
  .e-tree.is-lit { stroke: var(--ink); }
  .e-line { fill: none; stroke: var(--line-strong); stroke-width: 1.25; transition: opacity 0.35s ease; }
  .e-line.is-future { opacity: 0; }
  .mk--line { fill: var(--line-strong); }
  .e-rel { fill: none; stroke-width: 1.75; }
  .e-rel--follows { stroke: var(--ink); }
  .e-rel--amends { stroke: var(--run); stroke-width: 2.25; }
  .e-rel--supersedes { stroke: var(--sub); stroke-dasharray: 5 4; }
  .mk--follows { fill: var(--ink); }
  .mk--amends { fill: var(--run); }
  .mk--supersedes { fill: var(--sub); }

  /* outline view */
  .outline {
    position: absolute;
    inset: 0;
    overflow: auto;
    padding: 20px;
    background: var(--surface);
  }
  .outline h2 { margin: 0 0 4px; font-size: 18px; text-wrap: balance; }
  .outline > p { margin: 0 0 18px; color: var(--sub); max-width: 65ch; }
  .outline section { margin-bottom: 20px; }
  .outline h3 { margin: 0 0 8px; font-size: 15px; text-wrap: balance; }
  .outline h3 .row { font-weight: 600; font-size: 15px; }

  /* rows: ADR lines used in outline and panel */
  .rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .row {
    display: grid;
    grid-template-columns: 64px minmax(0, 1fr);
    gap: 2px 10px;
    align-items: baseline;
    width: 100%;
    text-align: left;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    cursor: pointer;
  }
  .row:hover { border-color: var(--line-strong); }
  .row.is-selected { border-color: var(--run); background: var(--run-bg); }
  .row.is-future { opacity: 0.55; }
  .row__id { font-family: var(--mono); font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .row__title { font-weight: 500; }
  .row__chips { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; }
  .row__note { grid-column: 2; font-size: 12.5px; color: var(--sub); }
  .row--q { grid-template-columns: minmax(0, 1fr); }
  .row--q .row__chips, .row--q .row__note { grid-column: 1; }

  /* progression */
  .progress__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
  .progress__head h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
  .progress__head h2 span { color: var(--sub); font-weight: 400; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .controls { display: flex; flex-wrap: wrap; gap: 4px; }
  .btn--play[aria-pressed="true"] { background: var(--run); border-color: var(--run); color: var(--on-run); }
  .timeline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .timeline__date {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--sub);
    padding-inline: 6px 2px;
  }
  .tick {
    min-width: 42px;
    height: 30px;
    padding: 0 6px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }
  .tick:hover { border-color: var(--line-strong); }
  .tick.is-past { background: var(--wash); }
  .tick.is-future { color: var(--sub); border-style: dotted; }
  .tick--rejected { text-decoration: line-through; text-decoration-color: var(--faint); }
  .tick--expiring { border: 1px dashed var(--def); }
  .tick.is-selected { box-shadow: 0 0 0 2px var(--run-ring); border-color: var(--run); }
  .tick.is-current { background: var(--run); border-color: var(--run); color: var(--on-run); border-style: solid; }
  .caption { margin: 0; font-size: 13.5px; max-width: 90ch; min-height: 2.9em; }
  .caption b { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--sub); margin-right: 8px; }
  .legend {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 14px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--sub);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend svg { flex: none; }

  /* panel */
  .panel .eyebrow { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--sub); }
  .panel h2 { margin: 4px 0 10px; font-size: 21px; line-height: 1.3; letter-spacing: -0.01em; text-wrap: balance; }
  .panel h3 { margin: 22px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--sub); }
  .panel p { margin: 0 0 8px; max-width: 65ch; }
  .panel .lead { font-size: 15px; line-height: 1.6; }
  .panel ul.bul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
  .panel .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
  .panel blockquote {
    margin: 14px 0;
    padding: 2px 0 2px 14px;
    border-left: 2px solid var(--line-strong);
    color: var(--ink);
  }
  .panel blockquote p { margin: 0 0 4px; font-size: 14.5px; }
  .panel blockquote cite { font-style: normal; font-size: 12px; color: var(--sub); }
  .box { margin-top: 18px; padding: 2px 12px 12px; border-radius: 8px; }
  .box h3 { margin-top: 10px; }
  .box--def { border: 1px dashed var(--def); background: var(--def-bg); }
  .box--def h3 { color: var(--def); }
  .box--rej { border: 1px solid var(--line); background: var(--wash); }
  .tbl-wrap { overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th, .tbl td { text-align: left; vertical-align: top; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  .tbl th { font-size: 12px; font-weight: 600; color: var(--sub); }
  .tbl td:first-child { font-family: var(--mono); font-size: 12px; white-space: nowrap; color: var(--sub); }
  .ref {
    border: 0;
    background: none;
    padding: 0;
    color: var(--link);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 0.92em;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .rel-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .rel-list li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; align-items: baseline; }
  .rel-list .rel-text { color: var(--sub); font-size: 13px; grid-column: 2; }
  .src { margin-top: 22px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--sub); }
  .src p { margin: 0 0 6px; }
  .src a { color: var(--link); word-break: break-all; }

  @media (max-width: 880px) {
    html, body { height: auto; }
    .app { height: auto; }
    .stage { display: flex; flex-direction: column; }
    .mapwrap { height: 64vh; height: 64svh; min-height: 360px; }
    .mapwrap.is-outline { height: auto; min-height: 0; }
    .mapwrap.is-outline .outline { position: static; }
    .panel { overflow: visible; padding: 18px 16px 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #world.glide { transition: none; }
    .node, .e-tree, .e-line { transition: none; }
    .node.is-new { animation: none; }
  }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1><span class="mark">enode</span>설계 지도</h1>
      <p id="meta">초기 ADR 10건</p>
    </div>
    <div class="tabs" role="tablist" aria-label="보기">
      <button type="button" role="tab" id="tab-map" aria-selected="true" aria-controls="canvas">마인드맵</button>
      <button type="button" role="tab" id="tab-outline" aria-selected="false" aria-controls="outline">개요</button>
    </div>
  </header>

  <main class="stage">
    <section class="mapwrap" id="mapwrap" aria-label="설계 마인드맵">
      <div class="canvas" id="canvas">
        <div id="world">
          <svg id="edges" aria-hidden="true"></svg>
        </div>
      </div>
      <div class="zoom" id="zoom">
        <button type="button" class="btn" id="zoom-in" aria-label="확대">+</button>
        <button type="button" class="btn" id="zoom-out" aria-label="축소">−</button>
        <button type="button" class="btn" id="zoom-fit">맞춤</button>
      </div>
      <div class="outline" id="outline" hidden></div>
    </section>

    <section class="progress" aria-label="설계 진행">
      <div class="progress__head">
        <h2>설계 진행<span id="step-count"></span></h2>
        <div class="controls">
          <button type="button" class="btn" id="step-first">처음</button>
          <button type="button" class="btn" id="step-prev">이전</button>
          <button type="button" class="btn btn--play" id="step-play" aria-pressed="false">재생</button>
          <button type="button" class="btn" id="step-next">다음</button>
        </div>
      </div>
      <div class="timeline" id="timeline" aria-label="ADR 순서"></div>
      <p class="caption" id="caption" aria-live="polite"></p>
      <div class="legend">
        <span><span class="chip">확정</span></span>
        <span><span class="chip chip--amended">개정됨</span></span>
        <span><span class="chip chip--rejected">기각</span></span>
        <span><span class="chip chip--expiring">만료 있음</span></span>
        <span><span class="chip chip--hw">물리 자원</span></span>
        <span><svg width="28" height="8" viewBox="0 0 28 8"><path d="M1 4 H27" class="e-rel e-rel--follows"/></svg>이어받음</span>
        <span><svg width="28" height="8" viewBox="0 0 28 8"><path d="M1 4 H27" class="e-rel e-rel--amends"/></svg>개정</span>
        <span><svg width="28" height="8" viewBox="0 0 28 8"><path d="M1 4 H27" class="e-rel e-rel--supersedes"/></svg>기각하고 대체</span>
      </div>
    </section>

    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>

<!--
  이 블록이 페이지의 데이터 전부다. 렌더러는 아래 스크립트이고 이 블록만 읽는다.
  지금은 사람이 ADR 원문에서 옮겨 적었다. 기준은 source.commit 이 가리키는 enode-design 이다.
  어긋나면 ADR 원문이 이긴다.
-->
<script type="application/json" id="design-map-data">
{
  "source": {

    { "from": "ADR-005", "to": "ADR-002", "type": "amends", "label": "Mediator 범위를 셋에서 넷으로 넓힌다" },
    { "from": "ADR-005", "to": "ADR-004", "type": "follows", "label": "비어 있던 평가 주체를 Mediator 로 닫는다" },
    { "from": "ADR-006", "to": "ADR-004", "type": "follows", "label": "테스트마다 조건이 달라도 여전히 기계적 조건이다" },
    { "from": "ADR-007", "to": "ADR-005", "type": "follows", "label": "미리 봉인한 Run Record 가 시연 위험을 덜어 준다" },
    { "from": "ADR-008", "to": "ADR-003", "type": "follows", "label": "단독 소유가 남긴 청구서. Mediator 는 누가 감시하나" },
    { "from": "ADR-008", "to": "ADR-005", "type": "follows", "label": "기록 조립까지 Mediator 에 몰렸다" },
    { "from": "ADR-009", "to": "ADR-008", "type": "follows", "label": "취소와 회수를 가르고, 멈추는 일은 시간 상한에 맡긴다" },
    { "from": "ADR-010", "to": "ADR-008", "type": "amends", "label": "근거 없던 실행 시간 상한을 not_after 로 대체한다" },
    { "from": "ADR-010", "to": "ADR-003", "type": "follows", "label": "장부 없이 토큰만 검사해 ADR-003 을 지키면서 I1 의 전제를 강제한다" }
  ]
}
</script>

<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("design-map-data").textContent);
  var SVGNS = "http://www.w3.org/2000/svg";
  var GAP_X = 48, GAP_Y = 12, GAP_Q = 36, PAD_X = 96, PAD_Y = 32;
  var K_MIN = 0.25, K_MAX = 2.2, K_READ = 0.45;

  var canvas = document.getElementById("canvas");
  var world = document.getElementById("world");
  var svg = document.getElementById("edges");
  var panel = document.getElementById("panel");
  var outline = document.getElementById("outline");
  var timeline = document.getElementById("timeline");
  var caption = document.getElementById("caption");
  var stepCount = document.getElementById("step-count");
  var playBtn = document.getElementById("step-play");

  var repoBase = "https://github.com/" + DATA.source.repo + "/blob/" + DATA.source.commit + "/";
  var shortSha = DATA.source.commit.slice(0, 7);

  var TYPE_TEXT = { supersedes: "기각하고 대체", amends: "개정", follows: "이어받음" };
  var STATUS_TEXT = { accepted: "확정", rejected: "기각", expiring: "만료 있음" };

  /* ---------- text helpers ---------- */

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }

  // 데이터 문자열의 작은 표기만 푼다: `코드`, **굵게**, 지도에 있는 ADR 번호는 버튼으로.
  function rich(s) {
    var out = esc(s);
    out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
    out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    out = out.replace(/ADR-\d{3}/g, function (id) {
      return nodes[id] ? "<button type=\"button\" class=\"ref\" data-go=\"" + id + "\">" + id + "</button>" : id;
    });
    return out;
  }

  /* ---------- model ---------- */

  var nodes = {};
  var order = [];

  function addNode(id, kind, d, parentId, side) {
    var parent = parentId ? nodes[parentId] : null;
    var n = { id: id, kind: kind, d: d, parent: parent, children: [], side: side, depth: parent ? parent.depth + 1 : 0 };
    if (parent) parent.children.push(n);
    nodes[id] = n;
    order.push(n);
    return n;
  }

  addNode("root", "root", DATA.root, null, 0);
  DATA.questions.forEach(function (q) {
    addNode(q.id, "q", q, "root", q.side === "left" ? -1 : 1);
  });
  var steps = DATA.adrs.slice().sort(function (a, b) { return a.n - b.n; });
  // 지도에서는 ADR 이 자기 되물음 바로 아래 한 열로 선다. 어느 결정에서 자랐는지(parent)는
  // 바깥쪽 호로 따로 그린다. 깊이가 가로로 쌓이면 지도가 납작해져 글자가 안 읽힌다.
  function branchOf(id) {
    var a = DATA.adrs.filter(function (x) { return x.id === id; })[0];
    return a ? branchOf(a.parent) : id;
  }
  steps.forEach(function (a) {
    var q = branchOf(a.parent);
    var n = addNode(a.id, "adr", a, q, nodes[q].side);
    n.lineage = nodes[a.parent].kind === "adr" ? nodes[a.parent] : null;
  });
  var N = steps.length;

  var rels = DATA.relations.map(function (r) {
    return { from: nodes[r.from], to: nodes[r.to], type: r.type, label: r.label };
  });

  function relationsOf(id) {
    return rels.filter(function (r) { return r.from.id === id || r.to.id === id; });
  }

  document.getElementById("meta").innerHTML =
    "초기 ADR " + N + "건 · 전체 " + DATA.source.adr_total + "건 · 정본 <code>enode-design@" + shortSha + "</code>";

  /* ---------- node elements ---------- */

  function chipsHtml(a) {
    var h = "";
    if (a.status === "rejected") h += "<span class=\"chip chip--rejected\">기각</span>";
    else if (a.status === "expiring") h += "<span class=\"chip chip--expiring\">만료 있음</span>";
    else h += "<span class=\"chip\">확정</span>";
    if (a.amended) h += "<span class=\"chip chip--amended\">개정됨</span>";
    if (a.hw) h += "<span class=\"chip chip--hw\">물리 자원</span>";
    return h;
  }

  order.forEach(function (n) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "node node--" + n.kind;
    b.dataset.id = n.id;
    if (n.kind === "root") {
      b.innerHTML = "<span class=\"node__eyebrow\">" + esc(n.d.eyebrow) + "</span>" +
        "<span class=\"node__title\">" + esc(n.d.title) + "</span>" +
        "<span class=\"node__sub\">" + esc(n.d.sub) + "</span>";
    } else if (n.kind === "q") {
      b.innerHTML = "<span class=\"node__eyebrow\">되물음</span>" +
        "<span class=\"node__title\">" + esc(n.d.title) + "</span>";
    } else {
      var a = n.d;
      if (a.status === "rejected") b.classList.add("is-rejected");
      if (a.status === "expiring") b.classList.add("is-expiring");
      b.innerHTML = "<span class=\"node__meta\"><span class=\"node__id\">" + a.id + "</span>" + chipsHtml(a) + "</span>" +
        "<span class=\"node__title\">" + esc(a.label) + "</span>";
      b.setAttribute("aria-label", a.id + " " + a.label);
    }
    b.addEventListener("click", function () { stopPlay(); select(n.id); });
    world.appendChild(b);
    n.el = b;
  });

  /* ---------- layout ---------- */

  var W = 0, H = 0;

  function subtree(n) {
    var total = 0;
    n.children.forEach(function (c, i) { total += subtree(c) + (i ? GAP_Y : 0); });
    n.sub = Math.max(n.h, total);
    return n.sub;
  }

  function place(n, top) {
    n.y = top + n.sub / 2;
    var total = 0;
    n.children.forEach(function (c, i) { total += c.sub + (i ? GAP_Y : 0); });
    var cy = n.y - total / 2;
    n.children.forEach(function (c) {
      c.x = n.x + c.side * (n.w / 2 + GAP_X + c.w / 2);
      place(c, cy);
      cy += c.sub + GAP_Y;
    });
  }

  function layout() {
    order.forEach(function (n) { n.w = n.el.offsetWidth; n.h = n.el.offsetHeight; });
    var root = nodes.root;
    root.x = 0; root.y = 0;
    [1, -1].forEach(function (side) {
      var qs = root.children.filter(function (q) { return q.side === side; });
      var total = 0;
      qs.forEach(function (q, i) { total += subtree(q) + (i ? GAP_Q : 0); });
      var top = -total / 2;
      qs.forEach(function (q) {
        q.x = root.w / 2 * side + side * (GAP_X + q.w / 2);
        place(q, top);
        top += q.sub + GAP_Q;
      });
    });
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    order.forEach(function (n) {
      minX = Math.min(minX, n.x - n.w / 2); maxX = Math.max(maxX, n.x + n.w / 2);
      minY = Math.min(minY, n.y - n.h / 2); maxY = Math.max(maxY, n.y + n.h / 2);
    });
    var ox = PAD_X - minX, oy = PAD_Y - minY;
    W = maxX - minX + PAD_X * 2;
    H = maxY - minY + PAD_Y * 2;
    order.forEach(function (n) {
      n.X = n.x + ox; n.Y = n.y + oy;
      n.el.style.left = (n.X - n.w / 2) + "px";
      n.el.style.top = (n.Y - n.h / 2) + "px";
    });
    world.style.width = W + "px";
    world.style.height = H + "px";
    drawEdges();
  }

  /* ---------- edges ---------- */

  function edgePt(n, side) { return { x: n.X + side * n.w / 2, y: n.Y }; }

  function curve(a, b) {
    var mx = (a.x + b.x) / 2;
    return "M" + a.x + "," + a.y + " C" + mx + "," + a.y + " " + mx + "," + b.y + " " + b.x + "," + b.y;
  }

  function treePath(p, c) { return curve(edgePt(p, c.side), edgePt(c, -c.side)); }

  // 같은 열의 두 노드는 바깥쪽으로 부푼 호로 잇는다. 멀수록 더 부풀려 호끼리 안 겹치게 한다.
  function arc(A, B) {
    var s = A.side || 1;
    var bulge = s * Math.min(84, 26 + Math.abs(A.Y - B.Y) * 0.22);
    var a = edgePt(A, s), b = edgePt(B, s);
    return "M" + a.x + "," + a.y + " C" + (a.x + bulge) + "," + a.y + " " + (b.x + bulge) + "," + b.y + " " + b.x + "," + b.y;
  }

  // older(to) 에서 newer(from) 로 그린다. 화살촉이 새 결정 쪽에 붙는다.
  function relPath(r) {
    var A = r.to, B = r.from;
    if (Math.abs(A.X - B.X) < 30) return arc(A, B);
    return A.X < B.X ? curve(edgePt(A, 1), edgePt(B, -1)) : curve(edgePt(A, -1), edgePt(B, 1));
  }

  function el(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    return e;
  }

  function drawEdges() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    var defs = el("defs", {});
    ["follows", "amends", "supersedes", "line"].forEach(function (t) {
      var m = el("marker", { id: "mk-" + t, viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "9", markerHeight: "9", markerUnits: "userSpaceOnUse", orient: "auto" });
      m.appendChild(el("path", { d: "M0,1 L10,5 L0,9 z", "class": "mk--" + t }));
      defs.appendChild(m);
    });
    svg.appendChild(defs);
    order.forEach(function (n) {
      if (!n.parent) return;
      n.edge = el("path", { d: treePath(n.parent, n), "class": "e-tree" + (n.kind === "q" ? " e-trunk" : "") });
      svg.appendChild(n.edge);
    });
    order.forEach(function (n) {
      if (!n.lineage) return;
      n.line = el("path", { d: arc(n.lineage, n), "class": "e-line", "marker-end": "url(#mk-line)" });
      svg.appendChild(n.line);
    });
    rels.forEach(function (r) {
      r.path = el("path", { d: relPath(r), "class": "e-rel e-rel--" + r.type, "marker-end": "url(#mk-" + r.type + ")" });
      r.path.style.display = "none";
      svg.appendChild(r.path);
    });
  }

  /* ---------- pan and zoom ---------- */

  var view = { tx: 0, ty: 0, k: 1, moved: false };

  function apply(glide) {
    world.classList.toggle("glide", !!glide);
    world.style.transform = "translate(" + view.tx + "px," + view.ty + "px) scale(" + view.k + ")";
  }

  function fit(glide) {
    var cw = canvas.clientWidth, ch = canvas.clientHeight;
    if (!cw || !ch || !W) return;
    view.k = Math.min((cw - 24) / W, (ch - 24) / H, 1.05);
    view.tx = (cw - W * view.k) / 2;
    view.ty = (ch - H * view.k) / 2;
    if (view.k < K_READ) {
      // 좁은 화면에서는 전부 담는 것보다 읽히는 것이 먼저다. 가운데를 두고 나머지는 끌어서 본다.
      view.k = K_READ;
      view.tx = cw / 2 - nodes.root.X * view.k;
      view.ty = ch / 2 - nodes.root.Y * view.k;
    }
    view.moved = false;
    apply(glide);
  }

  function zoomAt(px, py, factor) {
    var k = Math.min(K_MAX, Math.max(K_MIN, view.k * factor));
    view.tx = px - (px - view.tx) * (k / view.k);
    view.ty = py - (py - view.ty) * (k / view.k);
    view.k = k;
    view.moved = true;
    apply(false);
  }

  function reveal(n) {
    var cw = canvas.clientWidth, ch = canvas.clientHeight;
    if (!cw || outline.hidden === false) return;
    var sx = view.tx + n.X * view.k, sy = view.ty + n.Y * view.k;
    var hw = n.w * view.k / 2, hh = n.h * view.k / 2, m = 24;
    if (sx - hw >= m && sx + hw <= cw - m && sy - hh >= m && sy + hh <= ch - m) return;
    view.tx = cw / 2 - n.X * view.k;
    view.ty = ch / 2 - n.Y * view.k;
    apply(true);
  }

  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    var r = canvas.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });

  var pointers = {};
  var pinch = null;

  canvas.addEventListener("pointerdown", function (e) {
    if (e.target.closest(".node")) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add("is-panning");
    var ids = Object.keys(pointers);
    if (ids.length === 2) {
      var p = pointers[ids[0]], q = pointers[ids[1]];
      pinch = { d: Math.hypot(p.x - q.x, p.y - q.y) };
    }
  });

  canvas.addEventListener("pointermove", function (e) {
    var prev = pointers[e.pointerId];
    if (!prev) return;
    var ids = Object.keys(pointers);
    if (ids.length === 1) {
      view.tx += e.clientX - prev.x;
      view.ty += e.clientY - prev.y;
      view.moved = true;
      apply(false);
    }
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (ids.length === 2 && pinch) {
      var p = pointers[ids[0]], q = pointers[ids[1]];
      var d = Math.hypot(p.x - q.x, p.y - q.y);
      var r = canvas.getBoundingClientRect();
      if (pinch.d > 0) zoomAt((p.x + q.x) / 2 - r.left, (p.y + q.y) / 2 - r.top, d / pinch.d);
      pinch.d = d;
    }
  });

  function endPointer(e) {
    delete pointers[e.pointerId];
    if (Object.keys(pointers).length < 2) pinch = null;
    if (!Object.keys(pointers).length) canvas.classList.remove("is-panning");
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);

  function zoomCenter(f) { zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, f); }
  document.getElementById("zoom-in").addEventListener("click", function () { zoomCenter(1.2); });
  document.getElementById("zoom-out").addEventListener("click", function () { zoomCenter(1 / 1.2); });
  document.getElementById("zoom-fit").addEventListener("click", function () { fit(true); });

  /* ---------- state ---------- */

  var state = { sel: "root", step: N };
  var lastStep = N;

  function limitN() { return state.step === 0 ? 0 : steps[state.step - 1].n; }
  function isFuture(n) { return n.kind === "adr" && n.d.n > limitN(); }

  function select(id) {
    var n = nodes[id];
    if (!n) return;
    if (isFuture(n)) state.step = N;
    state.sel = id;
    render();
    reveal(n);
  }

  function goStep(s) {
    state.step = Math.max(0, Math.min(N, s));
    state.sel = state.step === 0 ? "root" : steps[state.step - 1].id;
    render();
    if (state.step === 0) fit(true); else reveal(nodes[state.sel]);
  }

  /* ---------- progression controls ---------- */

  var timer = null;

  function stopPlay() {
    if (timer) clearInterval(timer);
    timer = null;
    playBtn.setAttribute("aria-pressed", "false");
    playBtn.textContent = "재생";
  }

  playBtn.addEventListener("click", function () {
    if (timer) { stopPlay(); return; }
    if (state.step >= N) goStep(0);
    playBtn.setAttribute("aria-pressed", "true");
    playBtn.textContent = "멈춤";
    timer = setInterval(function () {
      if (state.step >= N) { stopPlay(); return; }
      goStep(state.step + 1);
    }, 2800);
  });
  document.getElementById("step-first").addEventListener("click", function () { stopPlay(); goStep(0); });
  document.getElementById("step-prev").addEventListener("click", function () { stopPlay(); goStep(state.step - 1); });
  document.getElementById("step-next").addEventListener("click", function () { stopPlay(); goStep(state.step + 1); });

  (function buildTimeline() {
    var start = document.createElement("button");
    start.type = "button";
    start.className = "tick";
    start.textContent = "시작";
    start.dataset.step = "0";
    timeline.appendChild(start);
    var lastDate = "";
    steps.forEach(function (a, i) {
      if (a.date !== lastDate) {
        var d = document.createElement("span");
        d.className = "timeline__date";
        d.textContent = a.date.slice(5);
        timeline.appendChild(d);
        lastDate = a.date;
      }
      var t = document.createElement("button");
      t.type = "button";
      t.className = "tick" + (a.status === "rejected" ? " tick--rejected" : "") + (a.status === "expiring" ? " tick--expiring" : "");
      t.textContent = a.id.slice(4);
      t.title = a.id + " " + a.label;
      t.setAttribute("aria-label", a.id + " " + a.label);
      t.dataset.step = String(i + 1);
      t.dataset.id = a.id;
      timeline.appendChild(t);
    });
    timeline.addEventListener("click", function (e) {
      var t = e.target.closest(".tick");
      if (!t) return;
      stopPlay();
      goStep(Number(t.dataset.step));
    });
  })();

  /* ---------- render ---------- */

  function render() {
    var sel = nodes[state.sel];
    var active = relationsOf(state.sel).filter(function (r) { return !isFuture(r.from) && !isFuture(r.to); });
    var relatedIds = {};
    active.forEach(function (r) {
      var other = r.from.id === state.sel ? r.to : r.from;
      relatedIds[other.id] = r.type;
    });

    order.forEach(function (n) {
      var fut = isFuture(n);
      var wasFuture = n.el.classList.contains("is-future");
      n.el.classList.toggle("is-future", fut);
      n.el.classList.toggle("is-new", wasFuture && !fut && state.step === lastStep + 1);
      n.el.tabIndex = fut ? -1 : 0;
      n.el.setAttribute("aria-hidden", fut ? "true" : "false");
      n.el.classList.toggle("is-selected", n.id === state.sel);
      n.el.classList.toggle("is-related", relatedIds[n.id] === "follows" || relatedIds[n.id] === "supersedes");
      n.el.classList.toggle("is-related-amends", relatedIds[n.id] === "amends");
      if (n.line) n.line.classList.toggle("is-future", fut);
      if (n.edge) {
        n.edge.classList.toggle("is-future", fut);
        var lit = sel.kind === "q" && (n.parent === sel || isInside(n, sel));
        n.edge.classList.toggle("is-lit", lit || (sel.kind === "root" && n.kind === "q"));
      }
    });
    rels.forEach(function (r) { r.path.style.display = active.indexOf(r) >= 0 ? "" : "none"; });

    Array.prototype.forEach.call(timeline.querySelectorAll(".tick"), function (t) {
      var s = Number(t.dataset.step);
      t.classList.toggle("is-current", s === state.step);
      t.classList.toggle("is-past", s < state.step);
      t.classList.toggle("is-future", s > state.step);
      t.classList.toggle("is-selected", t.dataset.id === state.sel && s !== state.step);
      t.setAttribute("aria-current", s === state.step ? "step" : "false");
    });
    stepCount.textContent = state.step + " / " + N;
    document.getElementById("step-prev").disabled = state.step === 0;
    document.getElementById("step-next").disabled = state.step === N;

    renderCaption(sel);
    renderPanel(sel);
    renderOutline();
    lastStep = state.step;
  }

  function isInside(n, ancestor) {
    for (var p = n.parent; p; p = p.parent) if (p === ancestor) return true;
    return false;
  }

  function renderCaption(sel) {
    var html;
    if (sel.kind === "adr") {
      html = "<b>" + sel.d.date.slice(5) + " · " + sel.d.id + "</b>" + rich(sel.d.caption);
    } else if (state.step === 0) {
      html = "<b>결정 전</b>발표 자료는 「기존 방식으로 되는 일이라면 Run 은 불필요한 복잡성이다」에서 출발한다. 다음을 누르면 초기 결정 " + N + "건이 나온 순서대로 붙는다.";
    } else if (state.step === N) {
      html = "<b>" + steps[0].date.slice(5) + " ~ " + steps[N - 1].date.slice(5) + "</b>초기 결정 " + N + "건이 네 가지 되물음 아래 모였다. 노드를 누르면 그 결정과 기각한 대안이 열린다. 처음을 누르면 나온 순서대로 다시 따라간다.";
    } else {
      var a = steps[state.step - 1];
      html = "<b>" + a.date.slice(5) + " · " + a.id + "</b>" + rich(a.caption);
    }
    caption.innerHTML = html;
  }

  /* ---------- panel ---------- */

  function list(items) {
    return "<ul class=\"bul\">" + items.map(function (s) { return "<li>" + rich(s) + "</li>"; }).join("") + "</ul>";
  }

  function section(title, body, cls) {
    return "<section" + (cls ? " class=\"" + cls + "\"" : "") + "><h3>" + title + "</h3>" + body + "</section>";
  }

  function quote(q) {
    return "<blockquote><p>" + rich(q.text) + "</p><cite>" + rich(q.cite) + "</cite></blockquote>";
  }

  function adrRow(a, note) {
    var n = nodes[a.id];
    return "<li><button type=\"button\" class=\"row" + (a.id === state.sel ? " is-selected" : "") + (isFuture(n) ? " is-future" : "") + "\" data-go=\"" + a.id + "\">" +
      "<span class=\"row__id\">" + a.id + "</span><span class=\"row__title\">" + esc(a.label) + "</span>" +
      "<span class=\"row__chips\">" + chipsHtml(a) + "</span>" +
      (note ? "<span class=\"row__note\">" + rich(note) + "</span>" : "") +
      "</button></li>";
  }

  function caseTable(ids) {
    var rows = DATA.root.cases.filter(function (c) { return !ids || ids.indexOf(c.id) >= 0; });
    return "<div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th>Case</th><th>상황</th><th>판정</th></tr></thead><tbody>" +
      rows.map(function (c) { return "<tr><td>" + c.id + "</td><td>" + rich(c.situation) + "</td><td>" + rich(c.verdict) + "</td></tr>"; }).join("") +
      "</tbody></table></div>";
  }

  function valueTable(ids) {
    var rows = DATA.root.values.filter(function (v) { return !ids || ids.indexOf(v.id) >= 0; });
    return "<div class=\"tbl-wrap\"><table class=\"tbl\"><thead><tr><th></th><th>주장</th><th>없으면</th></tr></thead><tbody>" +
      rows.map(function (v) { return "<tr><td>" + v.id + "</td><td>" + rich(v.claim) + "</td><td>" + rich(v.without) + "</td></tr>"; }).join("") +
      "</tbody></table></div>";
  }

  function footer(extra) {
    return "<div class=\"src\">" + (extra || "") +
      "<p>네 가지 되물음은 이 페이지가 ADR 을 묶으려고 붙인 틀이다. 결정의 정본은 ADR 원문이고, 요약이 원문과 어긋나면 원문이 이긴다.</p>" +
      "<p>기준 <code>" + esc(DATA.source.repo) + "@" + shortSha + "</code> (" + esc(DATA.source.commit_date) + ")</p></div>";
  }

  function srcLink(path) {
    return "<p>원문 <a href=\"" + repoBase + path + "\" target=\"_blank\" rel=\"noopener\">" + esc(path) + "</a></p>";
  }

  function renderPanel(sel) {
    var h = "";
    if (sel.kind === "root") {
      var r = sel.d;
      h += "<p class=\"eyebrow\">enode · AI-Native SDLC 실행 모델</p>";
      h += "<h2>" + esc(r.title) + "</h2>";
      h += "<p class=\"lead\">" + rich(r.lead) + "</p>";
      h += quote(r.premise);
      h += section("답하려는 질문은 두 단계다", "<ol class=\"bul\">" + r.stages.map(function (s) { return "<li>" + rich(s) + "</li>"; }).join("") + "</ol>");
      h += section("기존 방식이 힘을 잃는 자리", caseTable(null));
      h += section("증명해야 할 가치. 전부 반증 가능한 형태다", valueTable(null));
      h += section("성공 기준이 아닌 것", "<p>" + rich(r.not_goal) + "</p>");
      h += section("네 가지 되물음", "<ul class=\"rows\">" + DATA.questions.map(function (q) {
        return "<li><button type=\"button\" class=\"row row--q\" data-go=\"" + q.id + "\"><span class=\"row__title\">" + esc(q.title) + "</span></button></li>";
      }).join("") + "</ul>");
      h += footer(srcLink("docs/execution-model.md") + srcLink("docs/system.md"));
    } else if (sel.kind === "q") {
      var q = sel.d;
      h += "<p class=\"eyebrow\">되물음</p>";
      h += "<h2>" + esc(q.title) + "</h2>";
      h += "<p class=\"lead\">" + rich(q.answer) + "</p>";
      if (q.quote) h += quote(q.quote);
      var adrs = [];
      (function walk(n) { n.children.forEach(function (c) { adrs.push(c.d); walk(c); }); })(sel);
      adrs.sort(function (a, b) { return a.n - b.n; });
      h += section("답한 결정", "<ul class=\"rows\">" + adrs.map(function (a) { return adrRow(a, a.caption); }).join("") + "</ul>");
      if (q.cases.length) h += section("걸리는 Case", caseTable(q.cases));
      if (q.values.length) h += section("거는 가치", valueTable(q.values));
      h += footer("");
    } else {
      var a = sel.d;
      h += "<p class=\"eyebrow\">" + a.id + " · " + a.date + "</p>";
      h += "<h2>" + esc(a.title) + "</h2>";
      h += "<div class=\"chips\">" + chipsHtml(a) + (a.status_note ? "<span class=\"chip chip--supersedes\">" + esc(a.status_note) + "</span>" : "") + "</div>";
      h += "<p class=\"lead\">" + rich(a.decision) + "</p>";
      if (a.rejected_because) h += "<div class=\"box box--rej\">" + section("기각된 이유", "<p>" + rich(a.rejected_because) + "</p>") + "</div>";
      h += section("왜", list(a.why));
      if (a.quote) h += quote(a.quote);
      if (a.rejected) h += section(a.status === "rejected" ? "그때 기각한 대안" : "기각한 대안", list(a.rejected));
      if (a.cost) h += section("받아들인 대가", list(a.cost));
      if (a.undecided) h += "<div class=\"box box--def\">" + section("미정으로 남긴 값", list(a.undecided)) + "</div>";
      if (a.expiry) h += "<div class=\"box box--def\">" + section("만료", "<p>" + rich(a.expiry) + "</p>") + "</div>";
      if (a.later) h += section("뒤에 고친 것", list(a.later));
      if (a.reopen) h += section("재개 조건", (a.reopen_note ? "<p>" + rich(a.reopen_note) + "</p>" : "") + list(a.reopen));
      var before = rels.filter(function (r) { return r.from.id === a.id; });
      var after = rels.filter(function (r) { return r.to.id === a.id; });
      function relItems(arr, pick) {
        return "<ul class=\"rel-list\">" + arr.map(function (r) {
          var other = pick(r);
          return "<li><span class=\"chip chip--" + r.type + (r.type === "amends" ? " chip--amended" : "") + "\">" + TYPE_TEXT[r.type] + "</span>" +
            "<span><button type=\"button\" class=\"ref\" data-go=\"" + other.id + "\">" + other.id + "</button> " + esc(other.d.label) + "</span>" +
            "<span class=\"rel-text\">" + rich(r.label) + "</span></li>";
        }).join("") + "</ul>";
      }
      if (before.length) h += section("딛고 선 결정", relItems(before, function (r) { return r.to; }));
      if (after.length) h += section("뒤이은 결정", relItems(after, function (r) { return r.from; }));
      h += footer(srcLink(a.file));
    }
    panel.innerHTML = h;
  }

  /* ---------- outline view ---------- */

  function renderOutline() {
    if (outline.hidden) return;
    var h = "<h2>" + esc(DATA.root.title) + "</h2><p>" + rich(DATA.root.lead) + "</p>";
    DATA.questions.forEach(function (q) {
      var qn = nodes[q.id];
      var adrs = [];
      (function walk(n) { n.children.forEach(function (c) { adrs.push(c.d); walk(c); }); })(qn);
      adrs.sort(function (a, b) { return a.n - b.n; });
      h += "<section><h3><button type=\"button\" class=\"row row--q" + (state.sel === q.id ? " is-selected" : "") + "\" data-go=\"" + q.id + "\"><span class=\"row__title\">" + esc(q.title) + "</span></button></h3>" +
        "<ul class=\"rows\">" + adrs.map(function (a) { return adrRow(a, null); }).join("") + "</ul></section>";
    });
    outline.innerHTML = h;
  }

  function onGo(e) {
    var t = e.target.closest("[data-go]");
    if (!t) return;
    stopPlay();
    select(t.dataset.go);
  }
  panel.addEventListener("click", onGo);
  outline.addEventListener("click", onGo);
  caption.addEventListener("click", onGo);

  /* ---------- view tabs ---------- */

  var tabMap = document.getElementById("tab-map");
  var tabOutline = document.getElementById("tab-outline");
  function setView(v) {
    var isMap = v === "map";
    tabMap.setAttribute("aria-selected", String(isMap));
    tabOutline.setAttribute("aria-selected", String(!isMap));
    outline.hidden = isMap;
    canvas.hidden = !isMap;
    document.getElementById("mapwrap").classList.toggle("is-outline", !isMap);
    document.getElementById("zoom").hidden = !isMap;
    if (isMap) { if (!view.moved) fit(false); } else renderOutline();
  }
  tabMap.addEventListener("click", function () { setView("map"); });
  tabOutline.addEventListener("click", function () { setView("outline"); });

  /* ---------- boot ---------- */

  function relayout() {
    layout();
    if (!view.moved) fit(false);
    render();
  }

  relayout();
  if (window.matchMedia && window.matchMedia("(max-width: 600px)").matches) setView("outline");
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  if (window.ResizeObserver) {
    new ResizeObserver(function () { if (!view.moved) fit(false); }).observe(canvas);
  } else {
    window.addEventListener("resize", function () { if (!view.moved) fit(false); });
  }
})();
</script>
